# === HTTP (перенаправляет на HTTPS) ===
server {
    listen 80;
    server_name yagoworld.ru www.yagoworld.ru;

    # Для обновления сертификатов (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# === HTTPS (основной сервер) ===
server {
    listen 443 ssl http2;
    server_name yagoworld.ru www.yagoworld.ru;

    # Пути к сертификатам (Certbot сохраняет их сюда)
    ssl_certificate /etc/letsencrypt/live/yagoworld.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yagoworld.ru/privkey.pem;

    # Рекомендуемые настройки SSL (повышают безопасность)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Прокси на твой бэкенд (Kestrel)
    location / {
        proxy_pass http://webserver:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}